<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kane-cli context</title>
<style>
:root{
  --bg:#f7f8fa; --fg:#1b2430; --muted:#68727f; --panel:#ffffff; --line:#e2e6ec;
  --accent:#2563eb; --n-source:#6b7280; --n-usecase:#2563eb; --n-scenario:#7c3aed;
  --n-ac:#0d9488; --n-test:#d97706; --n-stylenote:#0891b2; --n-gap:#e11d48;
  --f-derivation:#6b7280; --f-linkage:#d97706; --f-mesh:#94a3b8; --f-crosslink:#db2777; --f-annotation:#0891b2;
  --trusted:#16a34a; --archived:#9ca3af; --stale:#d97706; --orphan:#dc2626;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1420; --fg:#e6ebf2; --muted:#94a3b8; --panel:#161b28; --line:#273246;
    --n-source:#94a3b8; --n-usecase:#60a5fa; --n-scenario:#c084fc; --n-ac:#5eead4; --n-test:#fbbf24;
    --n-stylenote:#67e8f9; --n-gap:#fb7185; --f-annotation:#67e8f9; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}
#header{display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);
  flex-wrap:wrap}
#header .title{font-weight:600}
#header .stat{color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:5px}
#header .stat:hover{background:var(--line);color:var(--fg)}
#header .stat b{color:var(--fg)}
#search{margin-left:auto;padding:5px 9px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel);color:var(--fg);min-width:180px}
#main{position:relative;overflow:hidden}
#graph{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#graph.grabbing{cursor:grabbing}
.laneband{fill:transparent}
.laneband.alt{fill:rgba(127,127,127,0.05)}
.lanelabel{fill:var(--muted);font-size:11px;font-weight:600}
.lanelabel.undesigned{font-style:italic;opacity:0.7}
.edge{fill:none;stroke-width:1.4}
.edge.f-derivation{stroke:var(--f-derivation)}
.edge.f-linkage{stroke:var(--f-linkage)}
.edge.f-mesh{stroke:var(--f-mesh);opacity:0.10}
.edge.f-crosslink{stroke:var(--f-crosslink);stroke-dasharray:5 4}
.edge.f-annotation{stroke:var(--f-annotation);stroke-dasharray:2 3;opacity:0.7}
.edge.inc{opacity:1 !important;stroke-width:2.2}
.edge.trace{opacity:1 !important;stroke-width:2.4}
.edge.hiddenfam{display:none}
.node{cursor:pointer}
.node rect{stroke:var(--line);stroke-width:1.4;rx:7}
.node .box.n-source{fill:color-mix(in srgb,var(--n-source) 16%,var(--panel))}
.node .box.n-usecase{fill:color-mix(in srgb,var(--n-usecase) 16%,var(--panel))}
.node .box.n-scenario{fill:color-mix(in srgb,var(--n-scenario) 16%,var(--panel))}
.node .box.n-ac{fill:color-mix(in srgb,var(--n-ac) 16%,var(--panel))}
.node .box.n-test{fill:color-mix(in srgb,var(--n-test) 16%,var(--panel))}
.node .box.n-stylenote{fill:color-mix(in srgb,var(--n-stylenote) 16%,var(--panel))}
.node .box.n-gap{fill:color-mix(in srgb,var(--n-gap) 16%,var(--panel))}
.node .slug{font-size:11px;font-weight:600;fill:var(--fg)}
.node .ttl{font-size:10px;fill:var(--muted)}
.node .bar{stroke-width:4}
.node.trust-trusted .bar{stroke:var(--trusted)}
.node.trust-archived .box{fill:url(#hatch);opacity:0.55}
.node.trust-archived .slug{text-decoration:line-through}
.node .badge{font-size:11px}
.node.dim{opacity:0.12}
.node.sel rect{stroke:var(--accent);stroke-width:2.4}
.node.trace rect{stroke:var(--accent);stroke-width:2.2}
.node.hiddennode{display:none}
.elabel{font-size:9px;fill:var(--fg)}
.elabel rect{fill:var(--panel);stroke:var(--line)}
#panel{position:absolute;top:0;right:0;width:390px;max-width:92vw;height:100%;background:var(--panel);
  border-left:1px solid var(--line);transform:translateX(100%);transition:transform .14s ease;
  overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
#panel.open{transform:none}
#panel h2{margin:0;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#panel .close{margin-left:auto;cursor:pointer;color:var(--muted);border:0;background:none;font-size:18px}
.crumb{color:var(--muted);font-size:11px}
.pill{font-size:10px;padding:1px 7px;border-radius:20px;border:1px solid var(--line)}
.pill.trusted{color:var(--trusted);border-color:var(--trusted)}
.pill.archived{color:var(--archived)}
.pill.stale{color:var(--stale);border-color:var(--stale)}
.pill.orphaned{color:var(--orphan);border-color:var(--orphan)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tab{padding:5px 10px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.tab.on{color:var(--fg);border-color:var(--accent)}
.chip{display:inline-block;font-size:10px;padding:1px 7px;margin:2px 3px 2px 0;border:1px solid var(--line);border-radius:20px;color:var(--muted)}
.kv{display:flex;gap:8px;margin:3px 0}
.kv .k{color:var(--muted);min-width:84px;text-transform:capitalize}
.kv .v{flex:1;overflow-wrap:anywhere}
.crit{margin:4px 0;padding-left:18px}
.pred{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);border:1px solid var(--line);
  border-radius:6px;padding:6px 8px;margin:4px 0;overflow-wrap:anywhere}
pre.md{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:6px;
  padding:8px;font-size:11px;max-height:280px;overflow:auto}
.rel h3{font-size:11px;color:var(--muted);margin:10px 0 4px}
.rel a{display:flex;gap:8px;padding:3px 5px;border-radius:5px;cursor:pointer;color:var(--fg);text-decoration:none}
.rel a:hover{background:var(--bg)}
.rel .et{color:var(--accent);font-size:10px;min-width:78px}
.lin{border-left:2px solid var(--line);padding-left:10px;margin:4px 0}
.lin .seq{color:var(--muted);font-size:10px}
#rail{display:flex;gap:2px;align-items:stretch;padding:8px 12px;border-top:1px solid var(--line);overflow-x:auto}
#rail .tick{border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;white-space:nowrap;
  background:var(--panel);font-size:11px}
#rail .tick:hover{border-color:var(--accent)}
#rail .tick.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
#rail .tick .k{color:var(--muted);text-transform:uppercase;font-size:9px;letter-spacing:.5px}
#legend{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;font-size:11px;max-width:230px}
#legend .row{display:flex;align-items:center;gap:6px;cursor:pointer;padding:1px 0}
#legend .sw{width:14px;height:0;border-top:3px solid}
#legend label{cursor:pointer}
.controls{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.controls button{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:7px;
  padding:6px 10px;cursor:pointer}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
  color:var(--muted);gap:8px;text-align:center}
.dimmed .node:not(.sel):not(.adj):not(.trace){opacity:0.12}
</style>
</head>
<body>
<div id="app">
  <div id="header"></div>
  <div id="main">
    <svg id="graph"><defs>
      <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="6" height="6" fill="var(--panel)"></rect>
        <line x1="0" y1="0" x2="0" y2="6" stroke="var(--archived)" stroke-width="2"></line>
      </pattern>
      <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="var(--muted)"></path>
      </marker>
    </defs></svg>
    <div id="empty"><div style="font-size:20px">No context yet</div>
      <div>Run <code>kane-cli context ingest</code> then <code>kane-cli context extract</code>.</div></div>
    <div id="legend"></div>
    <div class="controls">
      <button id="fit">Fit</button>
      <button id="clear">Clear</button>
    </div>
    <aside id="panel"></aside>
  </div>
  <div id="rail"></div>
</div>

      var ttl=S("text",{"class":"ttl",x:n.x+10,y:n.y+33}); ttl.textContent=trunc(n.title,34); grp.appendChild(ttl);
      var badge = n.fresh==="stale"?"!":(n.fresh==="orphaned"?"x":(n.fresh==="superseded"?"~":""));
      if(badge){ var bd=S("text",{"class":"badge",x:n.x+NODE_W-14,y:n.y+16,fill:"var(--stale)"}); bd.textContent=badge; grp.appendChild(bd); }
      grp.onclick=function(ev){ ev.stopPropagation(); select(this.dataset.cid); };
      grp.ondblclick=function(ev){ ev.stopPropagation(); trace(this.dataset.cid); };
      nodesLayer.appendChild(grp); nodeEls[n.cid]=grp; }
    fit();
  }
  function trunc(s,n){ s=esc(s); return s.length>n? s.slice(0,n-1)+"…" : s; }

  // ---------- pan / zoom ----------
  var vb = {x:0,y:0,w:1000,h:700};
  function setVB(){ g.setAttribute("viewBox", vb.x+" "+vb.y+" "+vb.w+" "+vb.h); }
  function fit(){ // fit the WHOLE graph (both dims) so the source spine + all lanes show
    var pad=50; var cw=g.clientWidth||1200, ch=g.clientHeight||700;
    var contentW=(D.width||1000)+pad*2, contentH=(D.height||700)+pad*2;
    var vw=Math.max(contentW, contentH*cw/ch), vh=vw*ch/cw;
    vb.x=-pad-(vw-contentW)/2; vb.y=-pad-(vh-contentH)/2; vb.w=vw; vb.h=vh; setVB(); }
  document.getElementById("fit").onclick=fit;
  var pan=null;
  g.addEventListener("pointerdown", function(ev){ pan={x:ev.clientX,y:ev.clientY,vx:vb.x,vy:vb.y}; g.classList.add("grabbing"); });
  window.addEventListener("pointerup", function(){ pan=null; g.classList.remove("grabbing"); });
  window.addEventListener("pointermove", function(ev){ if(!pan) return;
    var sx=vb.w/g.clientWidth, sy=vb.h/g.clientHeight;
    vb.x = pan.vx-(ev.clientX-pan.x)*sx; vb.y=pan.vy-(ev.clientY-pan.y)*sy; setVB(); });
  g.addEventListener("wheel", function(ev){ ev.preventDefault();
    // gentle, magnitude-scaled zoom (trackpads fire many events per gesture, so a
    // flat 10%/event compounds far too fast). Normalize line-mode deltas, clamp,
    // then zoom toward the cursor.
    var dy = ev.deltaY * (ev.deltaMode===1 ? 16 : 1);
    dy = Math.max(-40, Math.min(40, dy));
    var f = Math.exp(dy*0.0032);
    var nw = vb.w*f; if(nw < 80 || nw > (D.width||1000)*8){ return; }
    var rect = g.getBoundingClientRect();
    var px = (ev.clientX-rect.left)/Math.max(1,rect.width), py = (ev.clientY-rect.top)/Math.max(1,rect.height);
    var ax = vb.x+px*vb.w, ay = vb.y+py*vb.h;
    vb.w = nw; vb.h *= f; vb.x = ax-px*vb.w; vb.y = ay-py*vb.h; setVB();
  }, {passive:false});
  g.addEventListener("click", function(){ clearSel(); });

  // ---------- selection / highlight ----------
  function neighbors(cid){ var ns={}, es=[];
    for(var i=0;i<D.edges.length;i++){ var e=D.edges[i]; if(e.container) continue;
      if(e.src===cid){ ns[e.dst]=1; es.push(e); } else if(e.dst===cid){ ns[e.src]=1; es.push(e); } }
    return {ns:ns, es:es}; }
  function clearSel(){ selected=null; g.classList.remove("dimmed");
    for(var c in nodeEls){ nodeEls[c].classList.remove("sel","adj","trace"); }
    for(var k in edgeEls){ edgeEls[k].classList.remove("inc","trace"); }
    labelLayer.querySelectorAll(".elabel").forEach(function(x){x.remove();});
    document.getElementById("panel").classList.remove("open");
    if(location.hash) history.replaceState(null,"",location.pathname); }
  function select(cid){ var n=byCid[cid]; if(!n) return; selected=cid;
    for(var c in nodeEls){ nodeEls[c].classList.remove("sel","adj","trace"); }
    for(var k in edgeEls){ edgeEls[k].classList.remove("inc","trace"); }
    labelLayer.querySelectorAll(".elabel").forEach(function(x){x.remove();});
    g.classList.add("dimmed"); nodeEls[cid].classList.add("sel");
    var nb=neighbors(cid);
    for(var d in nb.ns){ if(nodeEls[d]) nodeEls[d].classList.add("adj"); }
    for(var i=0;i<nb.es.length;i++){ var e=nb.es[i]; var el=edgeEls[e.key]; if(el){ el.classList.add("inc"); edgeLabel(e); } }
    buildPanel(cid);
    location.hash = "node="+encodeURIComponent(n.slug);
  }
  function edgeLabel(e){ var s=byCid[e.src], d=byCid[e.dst]; if(!s||!d) return;
    var mx=((s.x+NODE_W)+d.x)/2, my=(s.y+d.y)/2+NODE_H/2;
    var w=e.type.length*6+10;
    var box=S("g",{"class":"elabel"});
    box.appendChild(S("rect",{x:mx-w/2,y:my-8,width:w,height:14,rx:3}));
    var t=S("text",{x:mx,y:my+2,"text-anchor":"middle"}); t.setAttribute("class","elabel"); t.textContent=e.type+(e.count>1?" x"+e.count:"");
    box.appendChild(t); labelLayer.appendChild(box); }

  // ---------- trace to source ----------
  function trace(cid){ // outgoing spine (incl. containment) + INCOMING derives to source (R5)
    var keepN={}, keepE={}; var stack=[cid]; keepN[cid]=1;
    while(stack.length){ var cur=stack.pop();
      for(var i=0;i<D.edges.length;i++){ var e=D.edges[i];
        var hit=null;
        // climb the provenance spine: follow outgoing non-DERIVES (incl. the
        // scoped_to/belongs_to containment that carries ac/scenario -> usecase),
        // then reach the source via the usecase's INCOMING DERIVES.
        if(e.src===cur && e.type!=="DERIVES"){ hit=e.dst; }
        else if(e.dst===cur && e.type==="DERIVES"){ hit=e.src; }
        if(hit){ if(!e.container) keepE[e.key]=1; if(!keepN[hit]){ keepN[hit]=1; stack.push(hit); } }
      } }
    g.classList.add("dimmed");
    for(var c in nodeEls){ var on=keepN[c]; nodeEls[c].classList.toggle("trace",!!on); nodeEls[c].classList.toggle("sel", c===cid); }
    for(var k in edgeEls){ edgeEls[k].classList.toggle("trace", !!keepE[k]); }
    buildPanel(cid);
    // no auto-zoom on interaction (owner directive) — the chain lights in place;
    // use Fit to re-frame the whole traced path incl. the source.
  }

  // ---------- panel ----------
  function buildPanel(cid){ var n=byCid[cid]; var p=document.getElementById("panel"); p.innerHTML="";
    var h=E("h2"); var icon={source:"S",usecase:"U",scenario:"C",ac:"A",test:"T",stylenote:"N",gap:"G"}[n.label]||"?";
    h.appendChild(E("span",{"class":"chip"},icon+" "+n.label));
    var sl=E("span",{},n.slug); sl.style.cursor="copy"; sl.title="click to copy cid";
    sl.onclick=function(){ if(navigator.clipboard) navigator.clipboard.writeText(n.cid); }; h.appendChild(sl);
    if(n.trust) h.appendChild(E("span",{"class":"pill "+n.trust}, n.trust));
    if(n.fresh && n.fresh!=="fresh") h.appendChild(E("span",{"class":"pill "+n.fresh}, n.fresh));
    var close=E("button",{"class":"close"},"×"); close.onclick=clearSel; h.appendChild(close);
    p.appendChild(h);
    p.appendChild(E("div",{"class":"crumb"}, breadcrumb(n)));
    if(n.title) p.appendChild(E("div",{},esc(n.title)));
    // tabs
    var tabs=E("div",{"class":"tabs"}); var body=E("div");
    var tContent=E("div",{"class":"tab on"},"content"), tRel=E("div",{"class":"tab"},"links"), tLin=E("div",{"class":"tab"},"lineage");
    tabs.appendChild(tContent); tabs.appendChild(tRel); tabs.appendChild(tLin); p.appendChild(tabs); p.appendChild(body);
    function show(which){ [tContent,tRel,tLin].forEach(function(t){t.classList.remove("on");}); which.classList.add("on");
      body.innerHTML="";
      if(which===tContent){ var d=E("div"); d.innerHTML=D.contentHtml[cid]||""; body.appendChild(d); }
      else if(which===tRel){ body.appendChild(relations(cid)); }
      else { body.appendChild(lineageView(cid)); } }
    tContent.onclick=function(){show(tContent);}; tRel.onclick=function(){show(tRel);}; tLin.onclick=function(){show(tLin);};
    show(tContent);
    // trace button
    var tb=E("button",{"class":"tab"},"Trace to source"); tb.onclick=function(){ trace(cid); };
    p.appendChild(tb);
    p.classList.add("open");
  }
  function breadcrumb(n){ var order={source:0,usecase:1,scenario:2,ac:3,test:4};
    if(order[n.label]===undefined) return "annotation (" + n.label + ")";
    return "source ▸ usecase ▸ scenario ▸ ac ▸ test".split(" ▸ ")
      .filter(function(x,i){return i<=order[n.label];}).join(" ▸ "); }
  function relations(cid){ var wrap=E("div",{"class":"rel"}); var inc={}, out={};
    for(var i=0;i<D.edges.length;i++){ var e=D.edges[i];
      if(e.src===cid){ (out[e.type]=out[e.type]||[]).push(e.dst); }
      if(e.dst===cid){ (inc[e.type]=inc[e.type]||[]).push(e.src); } }
    function group(title, map){ var keys=Object.keys(map); if(!keys.length) return;
      wrap.appendChild(E("h3",{},title));
      keys.forEach(function(t){ map[t].forEach(function(other){ var o=byCid[other]; if(!o) return;
        var a=E("a"); a.appendChild(E("span",{"class":"et"},t)); a.appendChild(E("span",{},o.slug||other.slice(7,19)));
        a.onclick=function(){ select(other); }; wrap.appendChild(a); }); }); }
    group("Incoming", inc); group("Outgoing", out);
    if(!wrap.querySelector("a")) wrap.appendChild(E("div",{"class":"crumb"},"no drawn relationships"));
    return wrap; }
  function lineageView(cid){ var wrap=E("div"); var ents=D.lineage[cid]||[];
    if(!ents.length){ wrap.appendChild(E("div",{"class":"crumb"},"no recorded lineage")); return wrap; }
    ents.forEach(function(en){ var d=E("div",{"class":"lin"});
      d.appendChild(E("div",{"class":"seq"}, (en.seq?("seq "+en.seq):en.kind)+(en.ts?("  "+en.ts.slice(0,10)):"")));
      d.appendChild(E("div",{}, en.kind+": "+esc(en.detail)));
      if(en.seq) d.style.cursor="pointer"; if(en.seq) d.onclick=function(){ railSelect(en.seq); };
      wrap.appendChild(d); });
    return wrap; }

  // ---------- filters ----------
  function applyFilters(){ var q=(document.getElementById("search").value||"").toLowerCase();
    for(var c in nodeEls){ var n=byCid[c]; var show=true;
      if(q && (n.slug+" "+n.title).toLowerCase().indexOf(q)<0) show=false;
      if(typeFilter && n.label!==typeFilter) show=false;
      if(trustFilter==="stale"){ if(n.fresh==="fresh") show=false; }
      else if(trustFilter && n.trust!==trustFilter) show=false;
      if(n.superseded && !showSuperseded) show=false;
      nodeEls[c].classList.toggle("hiddennode", !show); }
    for(var k in edgeEls){ var e2=edgeEls[k];
      var famOff = !famVisible[e2.dataset.family];
      var ns = nodeEls[e2.dataset.src], nd = nodeEls[e2.dataset.dst];
      var hidden = famOff || (ns&&ns.classList.contains("hiddennode")) || (nd&&nd.classList.contains("hiddennode"));
      e2.classList.toggle("hiddenfam", hidden); } }

  // ---------- legend ----------
  function buildLegend(){ var l=document.getElementById("legend"); l.innerHTML="";
    l.appendChild(E("div",{"style":"font-weight:600;margin-bottom:4px"},"edges (click to toggle)"));
    var fams=[["derivation","derives"],["linkage","automates"],["mesh","exercises/verifies"],["crosslink","depends/reuses"],["annotation","annotates"]];
    fams.forEach(function(f){ var r=E("div",{"class":"row"});
      var sw=E("span",{"class":"sw"}); sw.style.borderColor="var(--f-"+f[0]+")"; r.appendChild(sw);
      r.appendChild(E("label",{}, f[1]));
      r.onclick=function(){ famVisible[f[0]]=!famVisible[f[0]]; r.style.opacity=famVisible[f[0]]?"1":"0.4"; applyFilters(); };
      l.appendChild(r); });
    var ss=E("div",{"class":"row"}); var cb=E("input",{"type":"checkbox"});
    cb.onchange=function(){ showSuperseded=cb.checked; applyFilters(); };
    ss.appendChild(cb); ss.appendChild(E("label",{},"include superseded")); l.appendChild(ss);
    l.appendChild(E("div",{"style":"margin-top:6px;color:var(--muted)"},"dbl-click a node = trace to source")); }

  // ---------- rail ----------
  function buildRail(){ var r=document.getElementById("rail"); r.innerHTML="";
    D.commits.forEach(function(c){ var t=E("div",{"class":"tick"}); t.dataset.seq=c.seq;
      t.appendChild(E("div",{"class":"k"}, "#"+c.seq+" "+c.kind));
      t.appendChild(E("div",{}, c.label));
      t.onclick=function(){ railSelect(c.seq); }; r.appendChild(t); }); }
  function railSelect(seq){ var c=null; for(var i=0;i<D.commits.length;i++) if(D.commits[i].seq===seq) c=D.commits[i];
    if(!c) return;
    document.querySelectorAll("#rail .tick").forEach(function(t){ t.classList.toggle("on", t.dataset.seq==seq); });
    // highlight born nodes + edges, plus reviewed nodes for review commits (R8)
    var mark={}; c.mintedNodeCids.forEach(function(x){mark[x]=1;}); c.reviewedNodeCids.forEach(function(x){mark[x]=1;});
    var emark={}; c.mintedEdgeKeys.forEach(function(k){emark[k]=1;});
    g.classList.add("dimmed");
    for(var cc in nodeEls){ nodeEls[cc].classList.toggle("adj", !!mark[cc]); nodeEls[cc].classList.remove("sel","trace"); }
    for(var k in edgeEls){ edgeEls[k].classList.toggle("inc", !!emark[k]); }
    location.hash = "seq="+seq;
  }

  // ---------- hash restore ----------
  function restoreHash(){ var h=location.hash.replace(/^#/,""); if(!h) return;
    var m=/node=([^&]+)/.exec(h); if(m){ var slug=decodeURIComponent(m[1]);
      for(var c in byCid) if(byCid[c].slug===slug){ select(c); return; } }
    var s=/seq=(d+)/.exec(h); if(s){ railSelect(parseInt(s[1],10)); } }

  document.getElementById("clear").onclick=clearSel;

  buildHeader(); buildLegend(); renderGraph(); buildRail();
  applyFilters(); // hide superseded (and apply any default filters) on first paint
  window.addEventListener("resize", function(){ /* keep viewBox; user can Fit */ });
  restoreHash();
})();
</script>
</body>
</html>
